# mini_eval_v2.yaml
#
# Coverage-driven expanded evaluation benchmark.
# 84 scenarios across 8 buckets designed to expose all known
# planTF weakness areas present in the mini split.
#
# Bucket composition:
#   intersections     14  (traversing_intersection x4, traversing_tl x3,
#                          unprotected_cross x2, left_turn x1, right_turn x1,
#                          all_way_stop x1, plus 2 v1 known-hard tokens)
#   lane_change        7  (all available tokens in mini — coverage limited)
#   lead_vehicle      10  (following_slow x5, following_lead x3, stopping x2)
#   pedestrian        11  (near_ped_crosswalk x4, waiting_ped x3,
#                          near_ped_with_ego x2, stopping_crosswalk x2)
#   stop_and_go       12  (stationary_tl_lead x4, stationary_tl_nolead x3,
#                          stationary_in_traffic x3, accel_tl x2)
#   high_medium_speed 12  (high_speed x5, medium_speed x5, low_speed x2)
#   near_long_vehicle 10  (near_long x5, near_multiple x3, near_highspeed x2)
#   edge_cases         8  (high_lat_accel x2, trafficcone x2,
#                          construction x2, multi_ped x2)
#
# Known-hard scenarios from mini_benchmark_v1 (score=0.000) are explicitly
# included regardless of bucket counts.
#
# See docs/mini_scenario_inventory.md for full type availability and
# lane-change limitation notes.
# See docs/EVAL_PLAN.md for evaluation philosophy.
#
# DO NOT add random tokens here. Any additions must be documented with
# type, log, and rationale in docs/mini_scenario_inventory.md.

