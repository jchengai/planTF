# tl_intersection_eval.yaml
# --------------------------
# 21 traffic-light intersection scenarios from mini_eval_v2, extracted from the
# 2026-03-25 baseline run (84 scenarios, score=0.8401).
#
# Use this filter to quickly evaluate TL-specific changes (e.g. tl_safety.py)
# without running the full 84-scenario suite (~5 min vs ~20 min on an RTX 3060 laptop).
#
# Baseline scores per scenario:
#   5 × score=0.000  (zero-score, post-processor targets these)
#   16 × score=0.847–1.000  (passing, should be unaffected)
#
# Baseline type-level score: 0.7223

defaults:
  - mini

scenario_tokens:
  # --- zero-score in baseline (post-processor targets) ---
  - "48a1b05d9c6f5fd7"   # traversing_traffic_light_intersection  drivable=0 dir=0
  - "d9ee9cf40a84520f"   # traversing_traffic_light_intersection  collision=0 ttc=0
  - "a3b4b8e47696534e"   # traversing_traffic_light_intersection  dir=0
  - "eaf0200162f557cd"   # traversing_traffic_light_intersection  dir=0
  - "edb1d6776eb25f5d"   # traversing_traffic_light_intersection  drivable=0
  - "e4d09605e2b6563e"   # on_traffic_light_intersection          comfort=0 ttc=0

  # --- passing in baseline (regression check) ---
